name: analytic
x-database-url: &database-url postgresql://${POSTGRES_USER:-supachai}:${POSTGRES_PASSWORD:-9717}@db:5432/${POSTGRES_DB:-trading_db}

x-app-build: &app-build
  context: .
  target: runner

x-db-depends-on: &db-depends-on
  db:
    condition: service_healthy

x-ftp-env: &ftp-env
  FTP_HOST: ${FTP_HOST:-45.12.204.241}
  FTP_PORT: ${FTP_PORT:-21}
  FTP_USER: ${FTP_USER:-supachai}
  FTP_PASS: ${FTP_PASS:-9717}
  FTP_PATH: ${FTP_PATH}

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-supachai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-9717}
      POSTGRES_DB: ${POSTGRES_DB:-trading_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-supachai} -d ${POSTGRES_DB:-trading_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    command: >
      redis-server
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
        --save ""
        --appendonly no
        --requirepass ${REDIS_PASSWORD:-9717}
    networks:
      - backend_net
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  web:
    build: *app-build
    environment:
      DATABASE_URL: *database-url
      SECRET_KEY: ${SECRET_KEY:-therng}
      RUN_DB_MIGRATIONS: "true"
      REDIS_URL: redis://:${REDIS_PASSWORD:-9717}@redis:6379
      <<: *ftp-env
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-wss://therng.duckdns.org/ws}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://therng.duckdns.org}
      AUTH_SECRET: ${AUTH_SECRET:-therng}
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_URL: https://therng.duckdns.org
      AUTH_URL: ${AUTH_URL:-https://therng.duckdns.org}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_CLIENT_SECRET: ${APPLE_CLIENT_SECRET:-}
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on: *db-depends-on
    expose:
      - "3000"
    networks:
      - frontend_net
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 7s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  worker:
    build: *app-build
    command: node dist/worker.js
    environment:
      DATABASE_URL: *database-url
      RUN_DB_MIGRATIONS: "false"
      <<: *ftp-env
      WORKER_POLL_MS: ${WORKER_POLL_MS:-200000}
      WORKER_FILE_STABLE_MS: ${WORKER_FILE_STABLE_MS:-60000}
      WORKER_MIN_FILE_SIZE_BYTES: ${WORKER_MIN_FILE_SIZE_BYTES:-1024}
      WORKER_HEALTH_PORT: ${WORKER_HEALTH_PORT:-9100}
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on: *db-depends-on
    expose:
      - "9100"
    networks:
      - frontend_net
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9100/health || exit 1"]
      interval: 30s
      timeout: 7s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    environment:
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN}
    ports:
     - "80:80"
     - "443:443"
     - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    networks:
      - frontend_net
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  caddy_logs:
