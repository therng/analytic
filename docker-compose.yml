# =============================================================================
# docker-compose.yml — Analytic v2
#
# Services
# ─────────
#   db        PostgreSQL 15 (existing, unchanged)
#   web       Next.js 15 App Router + FTP worker entrypoint (existing Dockerfile)
#   worker    Node FTP import worker — reuses web image (existing)
#   redis     New: live-state cache + Pub/Sub
#   gateway   New: FastAPI ingestion API + WebSocket fanout
#   snapshot  New: Python snapshot persistence worker (60s Redis→PG)
#   caddy     TLS termination → web + gateway (Dockerfile.caddy)
#
# Networks
# ─────────
#   frontend_net  Caddy ↔ web ↔ gateway
#   backend_net   gateway ↔ redis ↔ db ↔ snapshot ↔ worker (internal)
# =============================================================================

name: analytic-v2

services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-supachai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-9717}
      POSTGRES_DB:       ${POSTGRES_DB:-trading_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-supachai} -d ${POSTGRES_DB:-trading_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    command: >
      redis-server
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
        --save ""
        --appendonly no
    networks:
      - backend_net
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── Next.js web app ────────────────────────────────────────────────────────
  web:
    build:
      context: .
      target: runner
    environment:
      DATABASE_URL:            postgresql://${POSTGRES_USER:-supachai}:${POSTGRES_PASSWORD:-9717}@db:5432/${POSTGRES_DB:-trading_db}
      SECRET_KEY:              ${SECRET_KEY:-therng}
      RUN_DB_MIGRATIONS:       "true"
      FTP_HOST:                ${FTP_HOST:-therng.thddns.net}
      FTP_PORT:                ${FTP_PORT:-21}
      FTP_USER:                ${FTP_USER:-supachai}
      FTP_PASS:                ${FTP_PASS:-9717}
      FTP_PATH:                ${FTP_PATH:-usb1_1_1/Metatrader5}
      # WebSocket endpoint surfaced to the browser via env
      NEXT_PUBLIC_WS_URL:      wss://api.therng.duckdns.org/ws
      NEXT_PUBLIC_API_URL:     https://api.therng.duckdns.org
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - frontend_net
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ── Node FTP import worker (reuses web image) ──────────────────────────────
  worker:
    build:
      context: .
      target: runner
    command: node dist/worker.js
    environment:
      DATABASE_URL:            postgresql://${POSTGRES_USER:-supachai}:${POSTGRES_PASSWORD:-9717}@db:5432/${POSTGRES_DB:-trading_db}
      RUN_DB_MIGRATIONS:       "false"
      FTP_HOST:                ${FTP_HOST:-therng.thddns.net}
      FTP_PORT:                ${FTP_PORT:-21}
      FTP_USER:                ${FTP_USER:-supachai}
      FTP_PASS:                ${FTP_PASS:-9717}
      FTP_PATH:                ${FTP_PATH:-usb1_1_1/Metatrader5}
      WORKER_POLL_MS:          ${WORKER_POLL_MS:-150000}
      WORKER_FILE_STABLE_MS:   ${WORKER_FILE_STABLE_MS:-60000}
      WORKER_MIN_FILE_SIZE_BYTES: ${WORKER_MIN_FILE_SIZE_BYTES:-1024}
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend_net
    healthcheck:
      disable: true
    restart: unless-stopped

  # ── FastAPI ingestion gateway ──────────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.backend
    # CMD from Dockerfile: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    environment:
      SECRET:       ${SECRET_KEY:-therng}
      REDIS_URL:    redis://redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER:-supachai}:${POSTGRES_PASSWORD:-9717}@db:5432/${POSTGRES_DB:-trading_db}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - frontend_net
      - backend_net
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ── Python snapshot worker (Redis → PostgreSQL every 60s) ──────────────────
  snapshot:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: python backend/worker.py
    environment:
      SECRET:       ${SECRET_KEY:-therng}
      REDIS_URL:    redis://redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER:-supachai}:${POSTGRES_PASSWORD:-9717}@db:5432/${POSTGRES_DB:-trading_db}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend_net
    restart: unless-stopped

  # ── Caddy reverse proxy (TLS termination) ─────────────────────────────────
  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      ACME_EMAIL:    ${ACME_EMAIL}
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    networks:
      - frontend_net
    depends_on:
      web:
        condition: service_healthy
      gateway:
        condition: service_healthy
    restart: unless-stopped

# =============================================================================
# Networks
# =============================================================================
networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
    internal: true   # backend services cannot reach the internet directly

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  caddy_logs:
