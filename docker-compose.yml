# =============================================================================
# docker-compose.yml — Analytic v2
# Services: caddy | gateway | worker | collector | redis | postgres
# =============================================================================

name: analytic-v2

# ---------------------------------------------------------------------------
# Shared environment — sourced from .env at project root
# ---------------------------------------------------------------------------
x-common-env: &common-env
    REDIS_URL:      redis://redis:6379
    DATABASE_URL:   postgresql://${PG_USER}:${PG_PASSWORD}@postgres:5432/${PG_DB}
    COLLECTOR_SECRET: ${COLLECTOR_SECRET}

services:

  # ──────────────────────────────────────────────────────────────────────────
  # CADDY — TLS termination + reverse proxy
  # ──────────────────────────────────────────────────────────────────────────
  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      ACME_EMAIL:      ${ACME_EMAIL}
      DUCKDNS_TOKEN:   ${DUCKDNS_TOKEN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data          # ACME certs & keys (persisted)
      - caddy_config:/config      # Caddy runtime config
      - caddy_logs:/var/log/caddy
    networks:
      - frontend_net
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ──────────────────────────────────────────────────────────────────────────
  # FASTAPI GATEWAY — ingestion API + WebSocket streaming
  # ──────────────────────────────────────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: gateway
    restart: unless-stopped
    command: >
      uvicorn main:app
        --host 0.0.0.0
        --port 8000
        --workers 2
        --log-level info
    environment:
      <<: *common-env
    networks:
      - frontend_net
      - backend_net
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    # Do NOT expose 8000 externally — Caddy is the only entry point
    expose:
      - "8000"

  # ──────────────────────────────────────────────────────────────────────────
  # SNAPSHOT WORKER — 1-min PostgreSQL persistence + trade reconciliation
  # ──────────────────────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: worker
    restart: unless-stopped
    command: python worker.py
    environment:
      <<: *common-env
    networks:
      - backend_net
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # ──────────────────────────────────────────────────────────────────────────
  # COLLECTOR — MT5 sidecar poller (runs on the same machine as MT5)
  # For production on a separate Windows/VPS machine, remove this service
  # and run collector/main.py directly on that machine instead.
  # ──────────────────────────────────────────────────────────────────────────
  collector:
    build:
      context: .
      dockerfile: Dockerfile.collector
    container_name: collector
    restart: unless-stopped
    environment:
      GATEWAY_URL:       https://api.therng.duckdns.org/ingest
      COLLECTOR_SECRET:  ${COLLECTOR_SECRET}
      POLL_INTERVAL_SECONDS: "5"
    networks:
      - backend_net
    depends_on:
      gateway:
        condition: service_healthy

  # ──────────────────────────────────────────────────────────────────────────
  # REDIS — live state cache + Pub/Sub fanout
  # ──────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: redis
    restart: unless-stopped
    command: >
      redis-server
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
        --save ""
        --appendonly no
    networks:
      - backend_net
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    # Expose only inside Docker network — never to host
    expose:
      - "6379"

  # ──────────────────────────────────────────────────────────────────────────
  # POSTGRESQL — snapshot storage + trade history
  # ──────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${PG_DB}
      POSTGRES_USER:     ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    networks:
      - backend_net
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backend/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "5432"

  # ──────────────────────────────────────────────────────────────────────────
  # NEXT.JS FRONTEND
  # ──────────────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_WS_URL:  wss://api.therng.duckdns.org/ws
      NEXT_PUBLIC_API_URL: https://api.therng.duckdns.org
    networks:
      - frontend_net
    expose:
      - "3000"
    depends_on:
      - gateway

# =============================================================================
# Networks — isolate frontend-facing from backend-only
# =============================================================================
networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
    internal: true   # backend services cannot reach the internet directly

# =============================================================================
# Volumes — all persistent data
# =============================================================================
volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
  redis_data:
  pg_data:
