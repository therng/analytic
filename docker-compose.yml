name: analytic
x-database-url: &database-url postgresql://${POSTGRES_USER:-supachai}:${POSTGRES_PASSWORD:-9717}@db:5432/${POSTGRES_DB:-trading_db}

x-app-build: &app-build
  context: .
  target: runner

x-db-depends-on: &db-depends-on
  db:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-supachai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-9717}
      POSTGRES_DB: ${POSTGRES_DB:-trading_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-supachai} -d ${POSTGRES_DB:-trading_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set — port 6379 is exposed publicly}
    command: >
      redis-server
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
        --save ""
        --appendonly no
        --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set — port 6379 is exposed publicly}
    networks:
      - backend_net
    ports:
      - "6379:6379"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  web:
    build: *app-build
    environment:
      TZ: Asia/Bangkok
      DATABASE_URL: *database-url
      RUN_DB_MIGRATIONS: "true"
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379
      AUTH_SECRET: ${AUTH_SECRET:-therng}
      AUTH_TRUST_HOST: "true"
      AUTH_URL: ${AUTH_URL:-https://therng.duckdns.org}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_CLIENT_SECRET: ${APPLE_CLIENT_SECRET:-}
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on: *db-depends-on
    expose:
      - "3000"
    networks:
      - frontend_net
      - backend_net
    healthcheck:
      test:
        ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 7s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  worker:
    build: *app-build
    command: node dist/worker.js
    environment:
      TZ: Asia/Bangkok
      DATABASE_URL: *database-url
      RUN_DB_MIGRATIONS: "false"
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379
      WORKER_POLL_MS: ${WORKER_POLL_MS:-200000}
      WORKER_HEALTH_PORT: ${WORKER_HEALTH_PORT:-9100}
      WORKER_ENABLE_LIVE_SYNC: ${WORKER_ENABLE_LIVE_SYNC:-false}
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on: *db-depends-on
    expose:
      - "9100"
    networks:
      - frontend_net
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9100/health || exit 1"]
      interval: 30s
      timeout: 7s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  worker-v2:
    build: *app-build
    command: node dist/worker-v2.js
    environment:
      TZ: Asia/Bangkok
      DATABASE_URL: *database-url
      RUN_DB_MIGRATIONS: "false"
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379
      WORKER_V2_BATCH_SIZE: ${WORKER_V2_BATCH_SIZE:-50}
      WORKER_V2_BLOCK_MS: ${WORKER_V2_BLOCK_MS:-5000}
      WORKER_V2_IDLE_RECLAIM_MS: ${WORKER_V2_IDLE_RECLAIM_MS:-60000}
      WORKER_V2_LIVE_SYNC_INTERVAL_MS: ${WORKER_V2_LIVE_SYNC_INTERVAL_MS:-2000}
      WORKER_V2_HEALTH_PORT: ${WORKER_V2_HEALTH_PORT:-9200}
      WORKER_V2_ACCOUNT_REFRESH_MS: ${WORKER_V2_ACCOUNT_REFRESH_MS:-60000}
      WORKER_V2_ENABLE_LIVE_SYNC: ${WORKER_V2_ENABLE_LIVE_SYNC:-true}
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on: *db-depends-on
    expose:
      - "9200"
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/health || exit 1"]
      interval: 30s
      timeout: 7s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    environment:
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    networks:
      - frontend_net
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  caddy_logs:
