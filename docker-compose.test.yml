name: analytic-test

services:
  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${TEST_POSTGRES_USER:-analytic_test}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-analytic_test}
      POSTGRES_DB: ${TEST_POSTGRES_DB:-trading_db_test}
    ports:
      - "5434:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${TEST_POSTGRES_USER:-analytic_test} -d ${TEST_POSTGRES_DB:-trading_db_test}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: "no"

  redis-test:
    image: redis:7.2-alpine
    command: >
      redis-server
        --maxmemory 128mb
        --maxmemory-policy allkeys-lru
        --save ""
        --appendonly no
        --requirepass ${TEST_REDIS_PASSWORD:-analytic_test}
    ports:
      - "6380:6379"
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${TEST_REDIS_PASSWORD:-analytic_test}",
          "ping",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: "no"

volumes:
  postgres_test_data:
