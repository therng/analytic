# Runs unit suites only: npm test (worker-v2 + rest of src/**/*.test.ts) and
# bridge_v2 pytest. Deliberately does NOT run the opt-in integration tests
# (RUN_WORKER_V2_HISTORY_INTEGRATION=1, RUN_HISTORY_RECOVERY_INTEGRATION=1,
# bridge_v2/tests/test_history_publisher_durable_redis_integration.py) — those
# need the isolated db-test:5434/redis-test:6380 stack (npm run test:env:up)
# stood up and migrated, which this workflow doesn't provision. Run them
# manually against that stack before a Package 5-style production rollout.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        options: >
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pytest

      - run: npm ci

      - run: npm run lint

      - run: npx prisma generate

      - run: npx prisma migrate deploy

      - run: npm run build

      - run: npm test

      - run: python3 -m pytest -q bridge_v2/tests
