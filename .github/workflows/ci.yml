# Runs unit suites only: npm test (worker-v2 + rest of src/**/*.test.ts) and
# bridge pytest. Deliberately does NOT run the opt-in integration tests
# (RUN_WORKER_V2_HISTORY_INTEGRATION=1, RUN_HISTORY_RECOVERY_INTEGRATION=1,
# bridge/tests/test_history_publisher_durable_redis_integration.py) — those
# need an isolated PostgreSQL + Redis stood up and migrated manually (the
# former docker test stack was removed in 8.46). Run them manually against
# local services before a Package 5-style production rollout.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        options: >
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pytest

      - run: npm ci

      - run: npm run lint

      - run: npx prisma generate

      - run: npx prisma migrate deploy

      - run: npm run build

      # touch-targets.test.ts (and any future Playwright-backed test) needs a
      # cached chromium binary — without this, npm test fails at
      # chromium.launch() before any assertion runs.
      - run: npx playwright install --with-deps chromium

      - run: npm test

      - run: pip install -r bridge/requirements-dev.txt

      - run: python3 -m pytest -q bridge/tests
